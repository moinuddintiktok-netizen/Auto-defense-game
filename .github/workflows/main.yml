name: Python Auto Defense Build

"on":
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Python Auto Defense EXE
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pygame pyinstaller

      - name: Check Python Syntax
        run: python -m py_compile python_auto_defense.py

      - name: Build Windows EXE
        run: pyinstaller --noconfirm --clean --onefile --windowed --name PythonAutoDefense python_auto_defense.py

      - name: Verify EXE
        shell: pwsh
        run: |
          if (!(Test-Path "dist/PythonAutoDefense.exe")) {
            throw "EXE file was not created."
          }
          Write-Host "Build successful!"

      - name: Upload Game Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Python-Auto-Defense-Windows
          path: dist/PythonAutoDefense.exe
          if-no-files-found: error
          retention-days: 14
